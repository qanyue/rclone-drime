---
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        shell: bash
        run: |
          mkdir -p build
          ldflags="-s -w -X github.com/rclone/rclone/fs.Version=$GITHUB_REF_NAME"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o build/rclone-linux-amd64
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o build/rclone-macos-arm64
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o build/rclone-windows-amd64.exe

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="These binaries are built without CGO and without the cmount build tag. CGO-based mount functionality is not included."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
            gh release upload "$GITHUB_REF_NAME" build/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" build/* --verify-tag --generate-notes --notes "$note" --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
